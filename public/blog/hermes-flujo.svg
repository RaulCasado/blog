<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xml:lang="es" role="img" aria-labelledby="t d"><title id="t">Del mensaje al modelo y las herramientas</title><desc id="d">Telegram intercambia mensajes con el gateway de Hermes. Hermes consulta el modelo local mediante una API y ejecuta las herramientas permitidas. Sus resultados vuelven al modelo antes de responder.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#7dd3fc"/></marker></defs><rect width="1600" height="900" rx="32" fill="#101c2a"/><g font-family="DejaVu Sans,sans-serif" text-anchor="middle" fill="#f1f5f9"><text x="800" y="132" font-size="62" font-weight="700">De Telegram al modelo</text><text x="800" y="190" font-size="27" >Hermes coordina; el modelo genera las respuestas</text><rect x="140" y="305" width="340" height="185" rx="18" fill="#1c3045" stroke="#6086a5" stroke-width="2"/><rect x="630" y="305" width="340" height="185" rx="18" fill="#1c3045" stroke="#6086a5" stroke-width="2"/><rect x="1120" y="305" width="340" height="185" rx="18" fill="#1c3045" stroke="#6086a5" stroke-width="2"/><text x="310" y="385" font-size="64" font-weight="700">Telegram</text><text x="310" y="450" font-size="28" >Mensaje y respuesta</text><text x="800" y="385" font-size="64" font-weight="700">Hermes</text><text x="800" y="450" font-size="28" >Gateway y sesión</text><text x="1290" y="385" font-size="62" font-weight="700">Modelo</text><text x="1290" y="450" font-size="27" >llama.cpp + Ornith</text><path d="M505 395H605" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#a)" marker-start="url(#a)"/><path d="M995 395H1095" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#a)" marker-start="url(#a)"/><rect x="545" y="635" width="510" height="130" rx="18" fill="#1c3045" stroke="#6086a5" stroke-width="2"/><text x="800" y="687" font-size="49" font-weight="700">Herramientas</text><text x="800" y="735" font-size="27" >Lecturas y acciones permitidas</text><path d="M800 515V610" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#a)" marker-start="url(#a)"/><text x="800" y="824" font-size="24" >Los resultados de las herramientas añaden contexto a la siguiente petición.</text></g></svg>