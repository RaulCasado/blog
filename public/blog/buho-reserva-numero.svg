<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xml:lang="es" role="img" aria-labelledby="t d"><title id="t">Dos guardados y una reserva por número</title><desc id="d">Sin reserva dos guardados leen el máximo 2 y eligen el ID 3. Con reserva el primer guardado adquiere el número, relee y escribe; el otro busca otro número. Releer evita usar un cálculo antiguo.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#7dd3fc"/></marker></defs><rect width="1600" height="900" rx="32" fill="#101c2a"/><g font-family="DejaVu Sans,sans-serif" text-anchor="middle" fill="#f1f5f9"><text x="800" y="132" font-size="60" font-weight="700">Un número, dos guardados</text><text x="800" y="190" font-size="27" >La reserva protege el ID compartido por los archivos</text><text x="440" y="295" font-size="50" font-weight="700">Sin reserva</text><text x="1160" y="295" font-size="50" font-weight="700">Con reserva</text><rect x="140" y="335" width="600" height="300" rx="18" fill="#1c3045" stroke="#6086a5" stroke-width="2"/><rect x="860" y="335" width="600" height="300" rx="18" fill="#1c3045" stroke="#6086a5" stroke-width="2"/><text x="440" y="407" font-size="49" >A lee 2 → elige 3</text><text x="440" y="477" font-size="49" >B lee 2 → elige 3</text><text x="440" y="575" font-size="37" font-weight="700">Dos ADR con el mismo ID</text><text x="1160" y="405" font-size="49" >A reserva 3</text><text x="1160" y="460" font-size="36" >Relee → escribe → libera</text><text x="1160" y="525" font-size="36" >B: 3 ocupado → prueba 4</text><text x="1160" y="585" font-size="48" font-weight="700">IDs distintos</text><text x="800" y="735" font-size="29" >Releer bajo la reserva evita reutilizar un número ya escrito.</text><text x="800" y="807" font-size="24" >Límite: todos los escritores deben respetar el mismo protocolo.</text></g></svg>