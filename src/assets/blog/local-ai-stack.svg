<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">The five layers of a local AI setup</title>
  <desc id="desc">A diagram showing a model loaded by a runtime, exposed by a server, controlled by a harness, and connected to tools and files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1d2940"/>
    </linearGradient>
    <linearGradient id="model" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="server" x1="0" x2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="harness" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#b8c5dc"/>
    </marker>
  </defs>
  <rect width="1600" height="860" rx="34" fill="url(#bg)"/>
  <text x="90" y="92" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="700">A local AI system is a stack</text>
  <text x="90" y="140" fill="#b8c5dc" font-family="Inter,Arial,sans-serif" font-size="25">Each layer has a different job. A model alone cannot read files or run tests.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="220" width="250" height="250" rx="26" fill="url(#model)"/>
    <rect x="390" y="220" width="250" height="250" rx="26" fill="url(#runtime)"/>
    <rect x="690" y="220" width="250" height="250" rx="26" fill="url(#server)"/>
    <rect x="990" y="220" width="250" height="250" rx="26" fill="url(#harness)"/>
    <rect x="1290" y="220" width="220" height="250" rx="26" fill="#334155"/>
  </g>

  <g fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <text x="215" y="278" font-size="27" font-weight="700">1. Model</text>
    <text x="215" y="325" font-size="20">The neural network</text>
    <text x="215" y="355" font-size="20">and its weights.</text>
    <text x="215" y="407" font-size="18">It generates text</text>
    <text x="215" y="435" font-size="18">or a tool request.</text>

    <text x="515" y="278" font-size="27" font-weight="700">2. Runtime</text>
    <text x="515" y="325" font-size="20">Loads the model</text>
    <text x="515" y="355" font-size="20">and does the maths.</text>
    <text x="515" y="407" font-size="18">Ollama, llama.cpp</text>
    <text x="515" y="435" font-size="18">or another engine.</text>

    <text x="815" y="278" font-size="27" font-weight="700">3. Server</text>
    <text x="815" y="325" font-size="20">Offers an API</text>
    <text x="815" y="355" font-size="20">to other programs.</text>
    <text x="815" y="407" font-size="18">It receives prompts</text>
    <text x="815" y="435" font-size="18">and returns answers.</text>

    <text x="1115" y="278" font-size="27" font-weight="700">4. Harness</text>
    <text x="1115" y="325" font-size="20">The coordinator.</text>
    <text x="1115" y="355" font-size="20">It exposes tools,</text>
    <text x="1115" y="385" font-size="20">checks results and</text>
    <text x="1115" y="415" font-size="20">decides when to stop.</text>

    <text x="1400" y="278" font-size="27" font-weight="700">5. Tools</text>
    <text x="1400" y="330" font-size="20">Files</text>
    <text x="1400" y="365" font-size="20">Tests</text>
    <text x="1400" y="400" font-size="20">Browser</text>
    <text x="1400" y="435" font-size="20">Web</text>
  </g>

  <g stroke="#b8c5dc" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M345 345 H375"/>
    <path d="M645 345 H675"/>
    <path d="M945 345 H975"/>
    <path d="M1245 345 H1275"/>
  </g>

  <rect x="90" y="570" width="1420" height="180" rx="24" fill="#0b1220" stroke="#40516e" stroke-width="2"/>
  <text x="130" y="630" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">The rule that saved several tests</text>
  <text x="130" y="680" fill="#dbe6f5" font-family="Inter,Arial,sans-serif" font-size="24">If the harness did not expose a test tool, the model did not run the tests.</text>
  <text x="130" y="720" fill="#dbe6f5" font-family="Inter,Arial,sans-serif" font-size="24">A sentence claiming that it did is only a sentence.</text>
</svg>
