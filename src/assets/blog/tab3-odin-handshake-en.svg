<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why Heimdall could not talk to the tablet's bootloader</title>
  <desc id="desc">Two ODIN handshake attempts side by side. On top, Heimdall issues a USB reset before saying hello and the bootloader stops answering: the control channel stays alive but the data endpoints return zero bytes. Below, without that reset, the bootloader replies LOKE and the session opens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1d2940"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" x2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="good" x1="0" x2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="host" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="dev" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#f87171"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#34d399"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="60" y="70" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Samsung Galaxy Tab 3: why the handshake kept failing</text>
  <text x="60" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#94a3b8">Same cable, same port, same bootloader. The only difference is one libusb call.</text>

  <!-- ============ PANEL A: CON RESET ============ -->
  <rect x="60" y="145" width="1480" height="330" rx="18" fill="#0b1220" stroke="#7f1d1d" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="145" width="1480" height="52" rx="18" fill="#1a0d0d"/>
  <rect x="60" y="180" width="1480" height="17" fill="#1a0d0d"/>
  <text x="88" y="180" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#fca5a5">Heimdall as shipped: it resets USB before saying hello</text>

  <!-- host -->
  <rect x="100" y="235" width="270" height="190" rx="14" fill="url(#host)" filter="url(#shadow)"/>
  <text x="235" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#fff">Laptop</text>
  <text x="235" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#dbeafe">heimdall flash</text>
  <text x="235" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#bfdbfe">libusb</text>

  <!-- reset step -->
  <rect x="430" y="255" width="300" height="150" rx="14" fill="url(#bad)" filter="url(#shadow)"/>
  <text x="580" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#fff">1. USB reset</text>
  <text x="580" y="333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#fee2e2">libusb_reset_device()</text>
  <text x="580" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#fecaca">this is what breaks it</text>
  <line x1="375" y1="330" x2="425" y2="330" stroke="#f87171" stroke-width="3" marker-end="url(#arrowRed)"/>

  <!-- device -->
  <rect x="1170" y="235" width="300" height="190" rx="14" fill="url(#dev)" filter="url(#shadow)"/>
  <text x="1320" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#fff">Odin bootloader</text>
  <text x="1320" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e9e5ff">screen: "Downloading..."</text>
  <text x="1320" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e9e5ff">looks alive, but it is</text>
  <text x="1320" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fca5a5">deaf to data</text>

  <!-- channels -->
  <text x="790" y="288" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">control channel (EP0)</text>
  <line x1="790" y1="300" x2="1160" y2="300" stroke="#94a3b8" stroke-width="3" stroke-dasharray="1 0" marker-end="url(#arrowGrey)"/>
  <text x="790" y="325" font-family="system-ui, sans-serif" font-size="16" fill="#22c55e">answers OK to everything</text>

  <text x="790" y="378" font-family="system-ui, sans-serif" font-size="17" fill="#fca5a5">2. "ODIN" over endpoint 0x02</text>
  <line x1="790" y1="390" x2="1160" y2="390" stroke="#f87171" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="790" y="415" font-family="ui-monospace, monospace" font-size="16" fill="#f87171">0 bytes · ETIMEDOUT · libusb -7</text>

  <!-- ============ PANEL B: SIN RESET ============ -->
  <rect x="60" y="510" width="1480" height="330" rx="18" fill="#0b1220" stroke="#14532d" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="510" width="1480" height="52" rx="18" fill="#08150f"/>
  <rect x="60" y="545" width="1480" height="17" fill="#08150f"/>
  <text x="88" y="545" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#86efac">With the reset neutralised by LD_PRELOAD: works first try</text>

  <rect x="100" y="600" width="270" height="190" rx="14" fill="url(#host)" filter="url(#shadow)"/>
  <text x="235" y="655" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#fff">Laptop</text>
  <text x="235" y="690" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#dbeafe">heimdall flash</text>
  <text x="235" y="721" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#bfdbfe">+ sin_reset.so</text>

  <rect x="430" y="620" width="300" height="150" rx="14" fill="#134e33" stroke="#10b981" stroke-width="2"/>
  <text x="580" y="668" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#a7f3d0">reset intercepted</text>
  <text x="580" y="700" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#6ee7b7">return 0;  // does nothing</text>
  <text x="580" y="732" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#86efac">the bootloader never notices</text>
  <line x1="375" y1="695" x2="425" y2="695" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="1170" y="600" width="300" height="190" rx="14" fill="url(#good)" filter="url(#shadow)"/>
  <text x="1320" y="655" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#fff">Odin bootloader</text>
  <text x="1320" y="690" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#d1fae5">replies "LOKE"</text>
  <text x="1320" y="724" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#d1fae5">session open</text>

  <text x="790" y="668" font-family="system-ui, sans-serif" font-size="17" fill="#86efac">"ODIN" over endpoint 0x02</text>
  <line x1="790" y1="682" x2="1160" y2="682" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="790" y="722" font-family="ui-monospace, monospace" font-size="16" fill="#6ee7b7">4 bytes sent · 4 received</text>

  <text x="60" y="878" font-family="system-ui, sans-serif" font-size="18" fill="#64748b">The misleading part: the control channel answers just as well in both cases, so the device looks healthy. Only the data endpoints go silent.</text>
</svg>
