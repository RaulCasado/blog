<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of a home server reachable only through a private VPN</title>
  <desc id="desc">Devices connect over Tailscale to a mini PC running five Docker containers: AdGuard Home, Immich, Navidrome, Calibre-Web-Automated and Vaultwarden, none of them exposed to the public internet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1d2940"/>
    </linearGradient>
    <linearGradient id="svc" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="vpn" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="dev" x1="0" x2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="38" font-weight="700">Cómo está montado servidorcito</text>
  <text x="60" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22">Nada abierto a internet. Todo entra por una red privada.</text>

  <!-- DISPOSITIVOS -->
  <text x="60" y="165" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="21" font-weight="600">MIS DISPOSITIVOS</text>
  <rect x="60" y="185" width="215" height="74" rx="12" fill="url(#dev)" filter="url(#shadow)"/>
  <text x="82" y="218" fill="#fff" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Móvil</text>
  <text x="82" y="243" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="16">fotos, música, claves</text>

  <rect x="295" y="185" width="215" height="74" rx="12" fill="url(#dev)" filter="url(#shadow)"/>
  <text x="317" y="218" fill="#fff" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Portátil</text>
  <text x="317" y="243" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="16">SSH y administración</text>

  <rect x="530" y="185" width="215" height="74" rx="12" fill="url(#dev)" filter="url(#shadow)"/>
  <text x="552" y="218" fill="#fff" font-family="system-ui, sans-serif" font-size="21" font-weight="700">PC de casa</text>
  <text x="552" y="243" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="16">acceso web</text>

  <rect x="765" y="185" width="215" height="74" rx="12" fill="#0b1220" stroke="#f59e0b" stroke-width="2"/>
  <text x="787" y="218" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Kobo</text>
  <text x="787" y="243" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="16">por WiFi normal, no VPN</text>

  <!-- TAILSCALE -->
  <path d="M165 265 L165 320" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M400 265 L400 320" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M635 265 L635 320" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="60" y="330" width="920" height="86" rx="14" fill="url(#vpn)" filter="url(#shadow)"/>
  <text x="85" y="368" fill="#fff" font-family="system-ui, sans-serif" font-size="25" font-weight="700">Tailscale — red privada cifrada (WireGuard)</text>
  <text x="85" y="396" fill="#e9e5ff" font-family="system-ui, sans-serif" font-size="17">Los dispositivos se ven entre sí estén donde estén. No hace falta abrir ni un puerto en el router.</text>

  <!-- SERVIDOR -->
  <rect x="60" y="460" width="1480" height="330" rx="18" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="90" y="505" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="26" font-weight="700">servidorcito</text>
  <text x="255" y="505" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19">HP ProDesk 400 G6 Mini · i5-10500T · 16 GB · NVMe 476 GB · Ubuntu 26.04</text>

  <rect x="90" y="530" width="272" height="112" rx="12" fill="url(#svc)" filter="url(#shadow)"/>
  <text x="112" y="565" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Immich</text>
  <text x="112" y="592" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">Fotos y vídeos</text>
  <text x="112" y="616" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">Copia automática del móvil</text>
  <text x="112" y="636" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="15">9,2 GB</text>

  <rect x="382" y="530" width="272" height="112" rx="12" fill="url(#svc)" filter="url(#shadow)"/>
  <text x="404" y="565" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Navidrome</text>
  <text x="404" y="592" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">Música propia</text>
  <text x="404" y="616" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">API Subsonic, ~50 MB de RAM</text>
  <text x="404" y="636" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="15">2,2 GB</text>

  <rect x="674" y="530" width="272" height="112" rx="12" fill="url(#svc)" filter="url(#shadow)"/>
  <text x="696" y="565" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Calibre-Web</text>
  <text x="696" y="592" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">Biblioteca de ebooks</text>
  <text x="696" y="616" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">Sincroniza con el Kobo</text>
  <text x="696" y="636" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="15">131 MB</text>

  <rect x="966" y="530" width="272" height="112" rx="12" fill="url(#svc)" filter="url(#shadow)"/>
  <text x="988" y="565" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Vaultwarden</text>
  <text x="988" y="592" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">Gestor de contraseñas</text>
  <text x="988" y="616" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">Compatible con Bitwarden</text>
  <text x="988" y="636" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="15">324 KB</text>

  <rect x="1258" y="530" width="252" height="112" rx="12" fill="url(#svc)" filter="url(#shadow)"/>
  <text x="1280" y="565" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">AdGuard Home</text>
  <text x="1280" y="592" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">DNS de toda la casa</text>
  <text x="1280" y="616" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="16">Bloquea anuncios en la red</text>
  <text x="1280" y="636" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="15">28 KB</text>

  <rect x="90" y="668" width="1420" height="96" rx="12" fill="#0f1a2e" stroke="#475569" stroke-width="2"/>
  <text x="115" y="702" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="19" font-weight="600">Debajo de todo:</text>
  <text x="115" y="732" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">Docker Compose (un fichero por servicio) · UFW denegando todo por defecto · fail2ban · SSH sin contraseña en un puerto no estándar</text>
  <text x="115" y="756" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">El router apunta su DNS a AdGuard, así que el bloqueo de anuncios funciona hasta en la tele, sin instalar nada en ella.</text>

  <text x="60" y="840" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">La excepción es el Kobo: sincroniza por la WiFi de casa, porque un lector de libros no puede instalar Tailscale.</text>
  <text x="60" y="872" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">Cifras de uso en disco tomadas del propio servidor el 8 de septiembre de 2026.</text>
</svg>
