<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">RAM and SSD price rises between 2025 and 2026</title>
  <desc id="desc">Bar chart comparing memory and storage prices before and after the 2025-2026 shortage: DDR5 per gigabyte rose from 6.84 to 27.20 dollars, a 2x32GB kit from 191 to 1118 dollars, NAND flash from 4.80 to 10.70 dollars, and a 1TB consumer SSD from 45 to 90 dollars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1d2940"/>
    </linearGradient>
    <linearGradient id="before" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="after" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1600" height="880" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="38" font-weight="700">Por qué este es mal momento para comprar un servidor</text>
  <text x="60" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22">Lo que costaba la memoria antes de la escasez, y lo que cuesta ahora</text>

  <!-- Leyenda -->
  <rect x="60" y="132" width="22" height="22" rx="5" fill="url(#before)"/>
  <text x="92" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="19">antes (mediados de 2025)</text>
  <rect x="350" y="132" width="22" height="22" rx="5" fill="url(#after)"/>
  <text x="382" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="19">ahora (principios de 2026)</text>

  <!-- Grupo 1: DDR5 por GB -->
  <text x="60" y="215" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Chip DDR5, precio por GB</text>
  <rect x="60" y="235" width="88" height="46" rx="8" fill="url(#before)" filter="url(#shadow)"/>
  <text x="160" y="266" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="21">6,84 $</text>
  <rect x="60" y="293" width="350" height="46" rx="8" fill="url(#after)" filter="url(#shadow)"/>
  <text x="422" y="324" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="21" font-weight="700">27,20 $</text>
  <text x="530" y="324" fill="#f87171" font-family="system-ui, sans-serif" font-size="20" font-weight="700">×4 en un solo trimestre</text>

  <!-- Grupo 2: kit 2x32GB -->
  <text x="60" y="400" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Kit de 2×32 GB DDR5-5600</text>
  <rect x="60" y="420" width="72" height="46" rx="8" fill="url(#before)" filter="url(#shadow)"/>
  <text x="144" y="451" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="21">191 $</text>
  <rect x="60" y="478" width="420" height="46" rx="8" fill="url(#after)" filter="url(#shadow)"/>
  <text x="492" y="509" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="21" font-weight="700">1.118 $</text>
  <text x="610" y="509" fill="#f87171" font-family="system-ui, sans-serif" font-size="20" font-weight="700">+485 % en seis meses</text>

  <!-- Grupo 3: NAND -->
  <text x="880" y="215" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Chip NAND TLC de 1 Tbit</text>
  <rect x="880" y="235" width="140" height="46" rx="8" fill="url(#before)" filter="url(#shadow)"/>
  <text x="1032" y="266" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="21">4,80 $</text>
  <rect x="880" y="293" width="312" height="46" rx="8" fill="url(#after)" filter="url(#shadow)"/>
  <text x="1204" y="324" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="21" font-weight="700">10,70 $</text>
  <text x="1320" y="324" fill="#f87171" font-family="system-ui, sans-serif" font-size="20" font-weight="700">×2,2</text>

  <!-- Grupo 4: SSD 1TB -->
  <text x="880" y="400" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="21" font-weight="700">SSD de consumo de 1 TB</text>
  <rect x="880" y="420" width="150" height="46" rx="8" fill="url(#before)" filter="url(#shadow)"/>
  <text x="1042" y="451" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="21">45 $</text>
  <rect x="880" y="478" width="300" height="46" rx="8" fill="url(#after)" filter="url(#shadow)"/>
  <text x="1192" y="509" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="21" font-weight="700">90 $</text>
  <text x="1276" y="509" fill="#f87171" font-family="system-ui, sans-serif" font-size="20" font-weight="700">el doble</text>

  <!-- CAUSA -->
  <rect x="60" y="570" width="1480" height="130" rx="14" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <text x="88" y="608" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="22" font-weight="700">La causa es la misma en los dos casos: la IA</text>
  <text x="88" y="642" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Samsung, SK Hynix y Micron pueden dedicar sus obleas a memoria HBM para aceleradores de IA, con mucho margen, o a memoria normal de PC, con poco.</text>
  <text x="88" y="670" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">En enero de 2026, más del 65 % de las obleas de DDR5 UDIMM fueron a servidores y aceleradores. Lo que queda para el resto es lo que sube de precio.</text>

  <rect x="60" y="722" width="1480" height="62" rx="14" fill="#1a1206" stroke="#f59e0b" stroke-width="2"/>
  <text x="88" y="762" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Los analistas coinciden en que es estructural, no un pico pasajero: no se espera alivio real hasta finales de 2027.</text>

  <text x="60" y="836" fill="#64748b" font-family="system-ui, sans-serif" font-size="17">Fuentes: Counterpoint Research, TrendForce y declaraciones del CEO de Phison, recopiladas en septiembre de 2026. Precios de mercado en dólares, orientativos.</text>
</svg>
