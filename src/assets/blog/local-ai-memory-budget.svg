<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why model size is not the whole memory budget</title>
  <desc id="desc">A diagram comparing VRAM and RAM, showing model weights, cache, context and operating system overhead.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#26334b"/></linearGradient>
    <linearGradient id="vram" x1="0" x2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="ram" x1="0" x2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <text x="90" y="90" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="700">A model needs more than space for its file</text>
  <text x="90" y="138" fill="#c5d2e6" font-family="Inter,Arial,sans-serif" font-size="25">The weights are only the first item in the bill.</text>

  <g filter="url(#shadow)">
    <rect x="110" y="210" width="650" height="530" rx="28" fill="#0b1220" stroke="#2e7da1" stroke-width="3"/>
    <rect x="840" y="210" width="650" height="530" rx="28" fill="#0b1220" stroke="#a75032" stroke-width="3"/>
  </g>
  <text x="435" y="270" text-anchor="middle" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">GTX 1080 Ti: 11 GB VRAM</text>
  <text x="1165" y="270" text-anchor="middle" fill="#fdba74" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">PC: 16 GB RAM</text>

  <rect x="170" y="325" width="530" height="78" rx="14" fill="url(#vram)"/>
  <text x="435" y="374" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Model weights</text>
  <rect x="170" y="423" width="350" height="66" rx="14" fill="#0e7490"/>
  <text x="345" y="465" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22">KV cache</text>
  <rect x="170" y="509" width="240" height="66" rx="14" fill="#155e75"/>
  <text x="290" y="551" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22">Context</text>
  <text x="170" y="638" fill="#c5d2e6" font-family="Inter,Arial,sans-serif" font-size="22">Longer context = more cache.</text>
  <text x="170" y="675" fill="#c5d2e6" font-family="Inter,Arial,sans-serif" font-size="22">When VRAM fills, work spills to RAM.</text>

  <rect x="900" y="325" width="530" height="78" rx="14" fill="url(#ram)"/>
  <text x="1165" y="374" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Weights moved from VRAM</text>
  <rect x="900" y="423" width="410" height="66" rx="14" fill="#b45309"/>
  <text x="1105" y="465" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22">Windows + programs</text>
  <rect x="900" y="509" width="340" height="66" rx="14" fill="#991b1b"/>
  <text x="1070" y="551" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22">KV cache + context</text>
  <text x="900" y="638" fill="#c5d2e6" font-family="Inter,Arial,sans-serif" font-size="22">RAM is slower than VRAM.</text>
  <text x="900" y="675" fill="#c5d2e6" font-family="Inter,Arial,sans-serif" font-size="22">If RAM fills, the OS starts swapping.</text>

  <rect x="170" y="790" width="1260" height="58" rx="16" fill="#f8fafc"/>
  <text x="800" y="828" text-anchor="middle" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">That is why a 17 GB model can load and still be unusable on this PC.</text>
</svg>
